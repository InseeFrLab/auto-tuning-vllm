name: Manual GuideLLM mock integration test

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run mock server integration test
        run: pytest -v manual_tests/test_guidellm_mock_server.py
