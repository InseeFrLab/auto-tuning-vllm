name: Package CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate metadata and archive contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distributions.py
      - name: Install wheel with all dependencies in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install --no-cache-dir dist/*.whl
          "$RUNNER_TEMP/package-venv/bin/python" -m pip check
      - name: Check installed imports, resources and CLI outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_package.py"
