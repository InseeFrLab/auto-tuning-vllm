# Minimal config to smoke-test n_repeats + log_metrics (Optuna SQLite dashboard).
study:
  name: "n_repeats_smoke_test"
  storage_file: "./optuna_studies/n_repeats_smoke_test/study.db"

optimization:
  approach: "single_objective"
  objectives:
    - metric: "output_tokens_per_second_median"
      direction: "maximize"
  sampler: "random"
  n_trials: 3
  n_repeats: 2
  max_concurrent_trials: 1
  log_metrics:
    - "output_tokens_per_second_median"
    - "time_to_first_token_ms_median"

baseline:
  enabled: false

benchmark:
  benchmark_type: "guidellm"
  model: "facebook/opt-125m"
  max_seconds: 30
  prompt_tokens: 64
  output_tokens: 64
  rate: 4

parameters:
  gpu_memory_utilization:
    enabled: true
    options: [0.85, 0.90]
