# Example study configuration
study:
  name: "vllm_optimization_example_1"

optimization:
  # Advanced multi-objective: Optimize throughput vs Time-To-First-Token.
  # `metric` is an arithmetic expression over identifiers of the form
  # `<name>_<percentile>`. Recommended default percentile is `_median`.
  approach: "multi_objective"
  objectives:
    - metric: "output_tokens_per_second_median"  # Maximize throughput
      direction: "maximize"
    - metric: "time_to_first_token_ms_p95"  # Worst-case TTFT
      direction: "minimize"
  # Optional: copy extra benchmark scalars to Optuna user attrs (metric_<name>)
  # for the dashboard; entries must be single combined metric keys matching
  # ObjectiveConfig metric identifiers (for example, "inter_token_latency_ms_p95"),
  # not arithmetic expressions.
  # log_metrics:
  #   - "prompt_tokens_per_second_median"
  #   - "inter_token_latency_ms_p95"
  #   - "vllm_kv_cache_usage_perc_p90"  # any Prometheus name vLLM exposes (no vllm: prefix)
  sampler: "nsga2"  # Best for multi-objective optimization
  n_trials: 11

benchmark:
  benchmark_type: "guidellm"
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  max_seconds: 300
  dataset: null  # Use synthetic data
  prompt_tokens: 500
  output_tokens: 500
  # Optional: reduce metric variance (requires recent GuideLLM CLI)
  # warmup: 0.1
  # cooldown: 0.1
  # rampup: 10
  # sample_requests: 0  # default; increase to keep detailed request samples in benchmark JSON

logging:
  file_path: "/tmp/auto-tune-vllm-logs" # Optional local file path
  nfs_path: null  # Optional NFS mount
  log_level: "INFO"

# Optional: scrape vLLM /metrics during the benchmark when log_metrics includes vllm_* ids
# metrics_scraping:
#   vllm:
#     scrape_interval_seconds: 10
#     align_with_benchmark_window: true

parameters:
  max_num_batched_tokens:
    enabled: true
    options: [1024, 2048, 10000]
